<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherGPT - Modern UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500/30">
  <!-- Glassmorphism Header -->
  <header class="bg-white/5 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-white shadow-[0_0_15px_rgba(6,182,212,0.4)]">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Weather<span class="text-cyan-400">GPT</span></h1>
          <p class="text-[10px] text-slate-400 uppercase tracking-widest">SIH26068 • AtmosX</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
          <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> IMD Feeds Live
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 relative">
    <!-- Background Glows -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-900/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

    <!-- Left Column -->
    <div class="lg:col-span-5 flex flex-col gap-6">
      <!-- Location Selector -->
      <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-5 shadow-xl">
        <h2 class="text-xs font-bold uppercase tracking-widest text-cyan-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-map-pin"></i> Select Region</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-1">State / UT</label>
            <select id="stateSelect" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-400 transition-colors cursor-pointer"></select>
          </div>
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-1">District / City</label>
            <select id="citySelect" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-400 transition-colors cursor-pointer"></select>
          </div>
        </div>
      </div>

      <!-- Live Risk Layer -->
      <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xs font-bold uppercase tracking-widest text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Active Threats</h2>
        </div>
        <div id="riskList" class="space-y-3 overflow-y-auto max-h-52 pr-2 custom-scroll"></div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="lg:col-span-7 flex flex-col gap-6">
      <!-- Live Map (FIXED BLANK ISSUE) -->
      <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-2 shadow-xl">
        <!-- Explicit height ensures map always renders -->
        <div id="disasterMap" class="w-full h-[350px] rounded-xl z-10 overflow-hidden relative">
            <div id="mapLoader" class="absolute inset-0 bg-slate-900 flex items-center justify-center z-[1000] text-cyan-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
        </div>
      </div>

      <!-- AI Chat Interface -->
      <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-5 shadow-xl flex-1 flex flex-col h-[400px]">
        <div class="flex items-center gap-3 mb-4 border-b border-white/10 pb-4">
           <div class="h-8 w-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center"><i class="fa-solid fa-robot"></i></div>
           <div>
             <h3 class="text-sm font-bold">WeatherGPT Assistant</h3>
             <p class="text-[10px] text-slate-400">Ask about any district in India</p>
           </div>
        </div>
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll text-sm">
          <div class="flex items-start gap-3">
            <div class="bg-slate-800/80 border border-white/5 rounded-2xl rounded-tl-none p-4 text-slate-200 max-w-[85%]">
              Namaste! I have live data for all 28 states and UTs. Select your district above or ask me directly (e.g. "Is it safe in Hathras?").
            </div>
          </div>
        </div>
        <form id="chatForm" class="mt-4 pt-4 border-t border-white/10 flex gap-2">
          <button type="button" id="micBtn" class="h-12 w-12 rounded-xl bg-slate-800/50 hover:bg-cyan-500/20 border border-white/10 text-slate-300 hover:text-cyan-400 transition flex items-center justify-center">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <input type="text" id="userInput" placeholder="Ask about safety..." class="flex-1 bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500/50 placeholder-slate-500">
          <button type="submit" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold px-6 rounded-xl shadow-lg shadow-cyan-500/25 transition-transform active:scale-95">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
